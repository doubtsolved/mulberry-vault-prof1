name: Transfer Release Assets to Hugging Face

on:
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Hugging Face Hub Library
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Download Release Assets from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./vault_assets
          gh release download v1-books --dir ./vault_assets --repo ${{ github.repository }}

      - name: Upload Assets to Hugging Face Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c '
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          api = HfApi(token=token)

          print("Starting upload to Hugging Face...")
          api.upload_folder(
              folder_path="./vault_assets",
              repo_id="sahabul1064/mulberry-archives",
              repo_type="dataset"
          )
          print("Upload completed successfully!")
          '
